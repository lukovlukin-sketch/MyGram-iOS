name: Build MyGram IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Custom Bundle ID for sideloading'
        required: false
        default: 'org.mygram.client'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 180

    steps:
      - name: Free up disk space
        run: |
          df -h
          sudo rm -rf /Users/runner/Library/Android/sdk || true
          sudo rm -rf /usr/local/share/dotnet || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Select Xcode
        run: |
          REQ_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_${REQ_XCODE}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${REQ_XCODE}.app/Contents/Developer"
          else
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
            echo "Requested Xcode ${REQ_XCODE} not found, using ${LATEST_XCODE}"
            sudo xcode-select -s "${LATEST_XCODE}/Contents/Developer"
          fi
          xcodebuild -version

      - name: Prepare MyGram build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          CUSTOM_BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'org.mygram.client' }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()
          bundle_id = os.environ.get("CUSTOM_BUNDLE_ID", "org.mygram.client").strip() or "org.mygram.client"

          with open("build-system/appstore-configuration.json", "r", encoding="utf-8") as f:
              cfg = json.load(f)

          # Keep bundle_id matching build-system/fake-codesigning/profiles (SideStore/Sideloadly rewrites it on install)
          if api_id and api_hash:
              cfg["api_id"] = api_id
              cfg["api_hash"] = api_hash
              print("Using custom TELEGRAM_API_ID / TELEGRAM_API_HASH from GitHub Secrets.")
          else:
              print("TELEGRAM_API_ID / TELEGRAM_API_HASH not set — using default open-source config values.")
          cfg["is_appstore_build"] = "false"
          cfg["is_internal_build"] = "true"
          cfg["enable_siri"] = False
          cfg["enable_icloud"] = False

          with open("build-system/mygram-configuration.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=4)

          print(f"Generated build-system/mygram-configuration.json with bundle_id={cfg['bundle_id']}")
          PY

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          mv "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          ln -s /Users/Shared/telegram-ios "$GITHUB_WORKSPACE"

      - name: Build MyGram IPA
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          BUILD_NUMBER="$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          which bazel || brew install bazelisk
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          set -o pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --configurationPath="build-system/mygram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" 2>&1 | tee /tmp/mygram_build.log || {
              ERR_TAIL=$(tail -n 25 /tmp/mygram_build.log | tr '\n' ' ' | cut -c1-1200)
              echo "::error::Build failed: $ERR_TAIL"
              exit 1
            }

          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" "$OUTPUT_PATH/MyGram-full.ipa"
          done

          # Create a sideload-friendly IPA (removes PlugIns/Watch extensions that hit free Apple ID 10-AppID limits)
          WORK_DIR=$(mktemp -d)
          unzip -q "$OUTPUT_PATH/MyGram-full.ipa" -d "$WORK_DIR"
          rm -rf "$WORK_DIR"/Payload/*.app/PlugIns
          rm -rf "$WORK_DIR"/Payload/*.app/Watch
          (cd "$WORK_DIR" && zip -qr "$OUTPUT_PATH/MyGram-sideload.ipa" Payload)
          rm -rf "$WORK_DIR"
          ls -lh "$OUTPUT_PATH"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/MyGram-sideload.ipa
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mygram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          name: MyGram ${{ env.APP_VERSION }} (build ${{ env.BUILD_NUMBER }})
          body: |
            Unsigned MyGram iOS build based on Swiftgram ${{ env.APP_VERSION }}.
            Install `MyGram-sideload.ipa` via Sideloadly or SideStore.
          files: |
            /Users/Shared/telegram-ios/build/artifacts/MyGram-sideload.ipa
